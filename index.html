<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht, initial-scale=1.0">
    <title>Облік посилок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Облік посилок</h1>
    <div class="table-conteiner">
        <table>
            <thead>
                <tr>
                    <th>Number</th>
                    <th>Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr onclick="toggleDetails('details-511')">
                    <td>511</td>
                    <td>Scale</td>
                    <td><span class="status available">In stock</span></td>
                </tr>
                <tr id= "details-511" class="details-row">
                    <td colspan="3">
                        Data received 10.10.2026
                    </td>
                </tr>
                <tr>
                    <td>506</td>
                    <td>Krom</td>
                    <td><span class="status available">In stock</span></td>
                </tr>
                <tr>
                    <td>111</td>
                    <td>Vitos</td>
                    <td><span class="status sent">Sent</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
<script>
    function toggleDetails(id) {
        const row = document.getElementById(id);
        if (row.style.display === "table-row") {
            row.style.display = "none";
        } else {
            row.style.display = "table-row";
        }
    }
</script>
</html>
