<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-widht, initial-scale=1.0">
    <title>Облік посилок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Облік посилок</h1>
    <div class="table-conteiner">
        <table>
            <thead>
                <tr>
                    <th>Number</th>
                    <th>Name</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><button class="expand-button" onclick="toggleDetails('details-511', this)">⌄</button> 511</td>
                    <td>Scale</td>
                    <td><span class="status available">In stock</span></td>
                </tr>
                <tr id= "details-511" class="details-row">
                    <td colspan="3">
                        Data received 10.10.2026
                    </td>
                </tr>
                <tr>
                    <td>506</td>
                    <td>Krom</td>
                    <td><span class="status available">In stock</span></td>
                </tr>
                <tr>
                    <td>111</td>
                    <td>Vitos</td>
                    <td><span class="status sent">Sent</span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
<script>
    function toggleDetails(id, button) {
  const row = document.getElementById(id);

  if (!row) return;

  const isHidden = getComputedStyle(row).display === "none";

  if (isHidden) {
    row.style.display = "table-row";
    button.textContent = "⌃";
  } else {
    row.style.display = "none";
    button.textContent = "⌄";
  }
}
</script>
</html>
